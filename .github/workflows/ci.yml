name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package with dev tools
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint (ruff)
      run: ruff check codenexus/ tests/

    # Run pytest directly to the step log (no file redirection). Output
    # streams before pytest exits, so a failure is always visible in the
    # Actions log even though the bash shell runs with `set -e`.
    - name: Test (pytest)
      shell: bash
      run: pytest tests/ --tb=long -ra -v