name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package with dev tools
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint (ruff)
      run: ruff check codenexus/ tests/

    - name: Test (pytest)
      shell: bash
      run: |
        set -o pipefail
        pytest tests/ --tb=long -ra -q --junitxml=results.xml > pytest-stdout.log 2>&1
        code=$?
        tail -n 60 pytest-stdout.log || true
        echo "exit_code=$code" >> pytest-stdout.log
        exit $code

    - name: Report results to job summary
      if: always()
      shell: python
      run: |
        import os
        from pathlib import Path

        out = []
        for name in ("pytest-exit.txt", "results.xml", "pytest-stdout.log"):
            fp = Path(name)
            if not fp.exists():
                out.append(f"[{name}] MISSING")
                continue
            data = fp.read_text(encoding="utf-8", errors="replace")
            if name == "pytest-stdout.log":
                out.append("=== tail(pytest-stdout.log) ===")
                out.extend(data.splitlines()[-45:])
            else:
                out.append(f"[{name}] present ({len(data)} bytes)")
        summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
        target = Path(summary) if summary else None
        text = chr(10).join(out) + chr(10)
        if target:
            with target.open("a", encoding="utf-8") as handle:
                handle.write(text)
        else:
            print(text)
        # Never fail here: diagnostics only. The Test step carries the status.
