name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package with dev tools
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint (ruff)
      run: ruff check codenexus/ tests/

    - name: Test (pytest)
      run: pytest tests/ --tb=short -q --junitxml=results.xml

    - name: Report results to job summary
      if: always()
      shell: python
      run: |
        import os, sys
        import xml.etree.ElementTree as ET

        path = "results.xml"
        lines = []
        failed = errored = total = 0
        try:
            root = ET.parse(path).getroot()
            suite = root.find("testsuite")
            total = int(suite.get("tests", 0))
            failed = int(suite.get("failures", 0))
            errored = int(suite.get("errors", 0))
            for case in suite.iter("testcase"):
                node = case.find("failure") or case.find("error")
                if node is not None:
                    lines.append("### FAIL: " + case.get("classname", "") + "::" + case.get("name", ""))
                    body = (node.get("message") or "")[:600]
                    lines.append("`" + body.replace("|", "\|") + "`")
        except Exception as exc:
            lines.append("results.xml missing/unreadable: " + repr(exc))

        summary = os.environ.get("GITHUB_STEP_SUMMARY")
        if summary:
            with open(summary, "a", encoding="utf-8") as f:
                f.write(f"**pytest**: {total} tests, {failed} failures, {errored} errors

")
                f.write("
".join(lines) + "
")
        sys.exit(1 if (failed or errored) else 0)
